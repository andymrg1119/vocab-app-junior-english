<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>初一英语背单词 - 译林版</title>
  <meta name="description" content="初一英语背单词应用：单词卡、默写、课文讲解、打卡、中考真题。基于译林版2024新教材。">
  <meta name="theme-color" content="#4CAF50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="背单词">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="app-header">
    <div class="header-left">
      <span class="app-title">初一英语背单词</span>
    </div>
    <div class="header-right">
      <select id="versionSelect" class="header-select" title="选择教材版本">
        <!-- 由JS动态填充 -->
      </select>
      <select id="bookSelect" class="header-select" title="选择上/下册">
        <!-- 由JS动态填充 -->
      </select>
    </div>
  </header>

  <!-- 主体区域 -->
  <div class="app-body">
    <!-- 左侧单元列表 -->
    <aside class="unit-sidebar" id="unitSidebar">
      <h3 class="sidebar-title">单元列表</h3>
      <ul class="unit-list" id="unitList">
        <!-- 由JS动态填充 -->
      </ul>
      <div class="sidebar-footer">
        <button class="reset-progress-btn" id="resetProgressBtn">⚙️ 重置进度</button>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- Tab导航 -->
      <nav class="tab-nav" id="tabNav">
        <button class="tab-btn active" data-tab="flashcard">单词卡</button>
        <button class="tab-btn" data-tab="wordlist">生词表</button>
        <button class="tab-btn" data-tab="phrases">短语</button>
        <button class="tab-btn" data-tab="sentences">经典句子</button>
        <button class="tab-btn" data-tab="textreader">课文讲解</button>
        <button class="tab-btn" data-tab="grammar">语法</button>
        <button class="tab-btn" data-tab="exam">中考真题</button>
        <button class="tab-btn" data-tab="dictation">默写</button>
        <button class="tab-btn" data-tab="wordbook">生词本</button>
        <button class="tab-btn" data-tab="review">今日复习 <span class="review-badge" style="display:none;"></span></button>
      </nav>

      <!-- 闯关进度条 -->
      <div class="tab-progress-bar" id="tabProgressBar"></div>

      <!-- Tab内容区 -->
      <div class="tab-content" id="tabContent">
        <!-- 由JS动态填充 -->
      </div>
    </main>
  </div>

  <!-- 底部打卡状态条 -->
  <footer class="app-footer">
    <div class="footer-left" id="footerCheckinInfo">
      <span class="footer-icon">📅</span>
      <span id="checkinStatusText">今日尚未打卡</span>
    </div>
    <div class="footer-center" id="footerStreakInfo">
      <span class="footer-icon">🔥</span>
      <span id="streakText">连续打卡：0天</span>
    </div>
    <div class="footer-right">
      <button class="checkin-btn" id="checkinBtn">今日打卡</button>
    </div>
  </footer>

  <!-- 打卡日历弹窗 -->
  <div class="modal-overlay" id="calendarModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>打卡日历</h3>
        <button class="modal-close" id="calendarClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="calendar-nav">
          <button id="prevMonth">&lt; 上月</button>
          <span id="calendarTitle">2026年1月</span>
          <button id="nextMonth">下月 &gt;</button>
        </div>
        <div class="calendar-grid" id="calendarGrid">
          <!-- 由JS动态填充 -->
        </div>
        <div class="calendar-stats" id="calendarStats">
          <!-- 由JS动态填充 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 打卡成功弹窗 -->
  <div class="modal-overlay" id="encourageModal">
    <div class="modal-content encourage-modal">
      <div class="modal-body">
        <p class="encourage-text" id="encourageText"></p>
        <button class="checkin-btn" id="encourageClose">太棒了！</button>
      </div>
    </div>
  </div>

  <!-- 关键词解释弹窗 -->
  <div class="modal-overlay" id="keywordModal">
    <div class="modal-content keyword-modal">
      <div class="modal-header">
        <h3 id="keywordTitle">关键词解释</h3>
        <button class="modal-close" id="keywordClose">&times;</button>
      </div>
      <div class="modal-body" id="keywordBody">
        <!-- 由JS动态填充 -->
      </div>
    </div>
  </div>

  <!-- 重置进度弹窗 -->
  <div class="modal-overlay" id="resetModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>重置学习进度</h3>
        <button class="modal-close" id="resetClose">&times;</button>
      </div>
      <div class="modal-body reset-modal-body">
        <p class="reset-tip">重置后无法恢复，请选择要重置的范围：</p>
        <button class="reset-option-btn" id="resetUnitBtn">
          <span class="reset-option-title">🔄 重置当前单元</span>
          <span class="reset-option-desc">清空当前单元的闯关进度，重新学习这一单元</span>
        </button>
        <button class="reset-option-btn danger" id="resetAllBtn">
          <span class="reset-option-title">🗑️ 重置全部进度</span>
          <span class="reset-option-desc">从第一单元重新开始（保留打卡记录和生词本）</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 数据脚本（必须按顺序加载） -->
  <script src="js/data-app.js"></script>
  <script src="js/data-7a.js"></script>
  <script src="js/data-7b.js"></script>
  <!-- 逻辑脚本 -->
  <script src="js/flashcard.js"></script>
  <script src="js/dictation.js"></script>
  <script src="js/text-reader.js"></script>
  <script src="js/exam.js"></script>
  <script src="js/review.js"></script>
  <script src="js/app.js"></script>
  <script>
    // PWA: 注册 Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js').then(function (reg) {
          // 每小时检查一次是否有新版本
          setInterval(function () { reg.update(); }, 60 * 60 * 1000);

          // 发现新版本 → 等它装好后通知立即接管
          reg.addEventListener('updatefound', function () {
            var sw = reg.installing;
            if (!sw) return;
            sw.addEventListener('statechange', function () {
              if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                sw.postMessage({ action: 'skipWaiting' });
              }
            });
          });
        }).catch(function (e) {
          console.warn('SW 注册失败', e);
        });

        // 新版本接管后自动刷新一次，确保用户拿到最新内容
        var reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (reloading) return;
          reloading = true;
          window.location.reload();
        });
      });
    }
  </script>
</body>
</html>
